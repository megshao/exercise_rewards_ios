name: SportsRewards
options:
  bundleIdPrefix: com.megshao
  # 全 App 以繁體中文為開發語言：系統元件（日期滾輪、警示按鈕等）不會退回英文。
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SportsRewardsKit:
    path: ".."

targets:
  SportsRewards:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SportsRewardsKit
    info:
      path: Generated/Info.plist
      properties:
        # 上架名稱定案為 Sports Rewards（活動名「揮汗有禮」會踩 guideline 4.1／5.2.1）。
        CFBundleDisplayName: Sports Rewards
        # 只使用系統 TLS（HTTPS），屬出口管制豁免；宣告後上傳 build 不必在 App Store Connect 手動回答加密問卷。
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 讀取步數以協助判斷是否達標（HealthKit，唯讀，never transmitted，不會被上傳）
        NSHealthShareUsageDescription: 讀取步數以判斷今日是否達標
        # Apple 上傳檢查（ITMS-90683）強制要求：只要帶 HealthKit entitlement，即使唯讀也必須有
        # 寫入用途字串。本 App 從不寫入健康資料，字串照實說明。
        NSHealthUpdateUsageDescription: 本 App 不會寫入任何健康資料，只讀取步數判斷今日是否達標
        # App Transport Security：只允許連線到官方網站 500.gov.tw（https），其餘一律禁止任意 http。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            500.gov.tw:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: true
              NSExceptionMinimumTLSVersion: TLSv1.2
    entitlements:
      path: Generated/SportsRewards.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.megshao.sportsrewards
        DEVELOPMENT_TEAM: 8DVXA389TX
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_ASSET_PATHS: ""
    postCompileScripts: []

  # 截圖用 UI 測試 target。獨立於主 target，不會被 Release archive 打包
  # （archive 只 build SportsRewards scheme 的 application target）。
  # 重跑方式見 UITests/ScreenshotTests.swift 檔頭。
  SportsRewardsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: SportsRewards
    info:
      path: Generated/SportsRewardsUITests-Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.megshao.sportsrewards.uitests
        DEVELOPMENT_TEAM: 8DVXA389TX
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: SportsRewards

schemes:
  SportsRewards:
    build:
      targets:
        SportsRewards: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # 上架素材截圖專用 scheme：只跑 SportsRewardsUITests，主 scheme 保持原樣。
  SportsRewardsScreenshots:
    build:
      targets:
        SportsRewards: [run, test]
        SportsRewardsUITests: [test]
    test:
      config: Debug
      targets:
        - SportsRewardsUITests
      environmentVariables:
        # 測試會把 PNG 直接寫到這個 host 目錄；$(SRCROOT) 是 App/。
        SCREENSHOT_OUTPUT_DIR: $(SRCROOT)/../design/screenshots/raw
