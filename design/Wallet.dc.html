<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--card:#ffffff;--line:#ecedf1;--line2:#e0e3e9;
      --pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;--ok:#12a150;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 20px 8px">
    <div style="font-family:var(--disp);font-weight:800;font-size:24px">我的券夾</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:4px">已取得 1 張 · 最多可獲得 14 張</div>
  </div>

  <div style="padding:14px 20px 0">
    <!-- active voucher with QR -->
    <div style="border-radius:22px;overflow:hidden;background:var(--card);
      border:1px solid var(--line);box-shadow:0 16px 34px rgba(17,20,28,.1)">
      <div style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
        background:linear-gradient(120deg,#ff7a2b,#ff5109)">
        <div><div style="font-family:var(--disp);font-weight:800;font-size:17px;color:#fff">全家便利商店</div>
          <div style="font-size:12px;color:#ffe6d3;margin-top:2px">50+3 元加碼券 · 第 1 期</div></div>
        <div style="width:44px;height:44px;border-radius:12px;background:#fff;
          display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;
          color:#0a8f4e;font-size:13px">全家</div>
      </div>

      <div style="padding:22px;display:flex;flex-direction:column;align-items:center">
        <!-- QR placeholder drawn as grid -->
        <div style="width:170px;height:170px;background:#fff;border:1px solid #eceef2;border-radius:14px;padding:12px;display:grid;
          grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px">
          <div style="background:#1a1d24;grid-column:1/3;grid-row:1/3;border-radius:3px"></div>
          <div style="background:#1a1d24;grid-column:6/8;grid-row:1/3;border-radius:3px"></div>
          <div style="background:#1a1d24;grid-column:1/3;grid-row:6/8;border-radius:3px"></div>
          <div style="background:#1a1d24;grid-column:4/5;grid-row:1/2"></div>
          <div style="background:#1a1d24;grid-column:4/5;grid-row:3/4"></div>
          <div style="background:#1a1d24;grid-column:5/6;grid-row:4/5"></div>
          <div style="background:#1a1d24;grid-column:4/5;grid-row:5/6"></div>
          <div style="background:#1a1d24;grid-column:6/7;grid-row:5/6"></div>
          <div style="background:#1a1d24;grid-column:4/6;grid-row:6/7"></div>
          <div style="background:#1a1d24;grid-column:6/8;grid-row:7/8"></div>
          <div style="background:#1a1d24;grid-column:3/4;grid-row:4/5"></div>
        </div>
        <div style="margin-top:14px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:2px">FML 5083 2246</div>
        <div style="margin-top:6px;font-size:12px;color:var(--muted)">有效至 2026/12/31 · 限本人使用不可轉讓</div>
        <div style="margin-top:4px;font-size:12px;color:var(--ok)">出示給店員掃描即可折抵</div>
      </div>
    </div>

    <!-- pending redeemable -->
    <div style="margin-top:14px;background:var(--card);border:1px dashed var(--line2);border-radius:18px;
      padding:16px 18px;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:11px;background:#ffece1;
        display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff5a1f" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg></div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">第 2 期加碼券</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">任務完成 · 尚未兌換</div></div>
      <div style="font-size:13px;color:var(--pri);font-weight:700">去兌換 ›</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
