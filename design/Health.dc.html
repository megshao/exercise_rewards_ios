<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--card:#ffffff;--line:#ecedf1;--line2:#e0e3e9;
      --pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;--ok:#12a150;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
    .stat{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;box-shadow:0 5px 14px rgba(17,20,28,.04)}
    .sv{font-family:var(--disp);font-weight:800;font-size:22px}
    .sl{font-size:11px;color:var(--muted);margin-top:2px}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 20px 12px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-family:var(--disp);font-weight:800;font-size:24px">健康數據</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);background:#e6f6ee;
      padding:6px 11px;border-radius:999px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#12a150" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l9 9 8.6-8.4a5.5 5.5 0 0 0 0-7.4Z"/></svg>
      已連 Apple 健康</div>
  </div>

  <div style="padding:6px 20px 0">
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">2026/09/03（四）· 資料來源：Apple 健康</div>

    <!-- big ring -->
    <div style="background:var(--card);border:1px solid var(--line);border-radius:24px;
      padding:22px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 30px rgba(17,20,28,.07)">
      <div style="position:relative;width:180px;height:180px">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="78" fill="none" stroke="#eceef2" stroke-width="16"/>
          <circle cx="90" cy="90" r="78" fill="none" stroke="url(#gh)" stroke-width="16" stroke-linecap="round"
            stroke-dasharray="490" stroke-dashoffset="98" transform="rotate(-90 90 90)"/>
          <defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc24d"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-family:var(--disp);font-weight:800;font-size:40px;line-height:1">9,688</div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">步 · 目標 8,000</div>
          <div style="margin-top:8px;display:inline-flex;align-items:center;gap:5px;background:var(--ok);color:#fff;
            font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px">達標 121%</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px">
      <div class="stat"><div class="sv">6.4<span style="font-size:13px;font-weight:600"> km</span></div><div class="sl">步行距離</div></div>
      <div class="stat"><div class="sv">42<span style="font-size:13px;font-weight:600"> 分</span></div><div class="sl">運動時間</div></div>
      <div class="stat"><div class="sv">7,726</div><div class="sl">本週平均步數</div></div>
    </div>

    <!-- meets criteria -->
    <div style="margin-top:14px;background:#e6f6ee;border:1px solid #b7e5cb;
      border-radius:16px;padding:14px 15px;display:flex;gap:11px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12a150" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.1l-3-3"/></svg>
      <div style="font-size:13px;color:#186c3e;line-height:1.6">
        今日已符合任務條件：<b style="color:#0d5730">單日 8,000 步</b>，可產生本週上傳圖卡。</div>
    </div>

    <button style="width:100%;margin-top:16px;border:none;cursor:pointer;border-radius:18px;padding:16px;
      background:linear-gradient(120deg,#ff7a2b,#ff5109);color:#fff;font-family:var(--disp);font-weight:800;
      font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px;
      box-shadow:0 10px 24px rgba(255,90,31,.28)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="9" cy="9" r="1.6"/></svg>
      產生上傳圖卡</button>
  </div>
</div>
</x-dc>
</body>
</html>
