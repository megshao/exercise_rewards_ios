<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--card:#ffffff;--line:#ecedf1;--line2:#e0e3e9;
      --pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;--ok:#12a150;--warn:#9a6400;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
    .store{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:15px 16px;
      display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 5px 14px rgba(17,20,28,.04)}
    .logo{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
      font-family:var(--disp);font-weight:800;font-size:15px;flex:none;color:#fff}
    .redeem{border:none;cursor:pointer;background:#ff5a1f;color:#fff;font-family:var(--disp);font-weight:800;
      font-size:13px;padding:10px 18px;border-radius:12px}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 20px 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:#fff">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1d24" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-family:var(--disp);font-weight:800;font-size:20px">兌換好禮 · 第 1 期</div>
  </div>

  <div style="padding:18px 20px 0">
    <div style="background:#fff4d6;border:1px solid #f2dca0;border-radius:14px;
      padding:12px 14px;font-size:12.5px;color:#7a5a12;line-height:1.6;margin-bottom:18px">
      選一家超商兌換，每張加碼券限抵用一次、送出後不可更換。兌換後需簡訊驗證才會產生券碼。</div>

    <div class="store">
      <div class="logo" style="background:#0a8f4e">全家</div>
      <div style="flex:1"><div style="font-family:var(--disp);font-weight:700;font-size:15px">全家便利商店</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">50+3 元加碼券</div></div>
      <button class="redeem">兌換</button>
    </div>
    <div class="store">
      <div class="logo" style="background:#e8501f">7-11</div>
      <div style="flex:1"><div style="font-family:var(--disp);font-weight:700;font-size:15px">7-ELEVEN</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">50+5 元加碼券</div></div>
      <button class="redeem">兌換</button>
    </div>
    <div class="store">
      <div class="logo" style="background:#c1121f">萊爾富</div>
      <div style="flex:1"><div style="font-family:var(--disp);font-weight:700;font-size:15px">萊爾富</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">50 元加碼券</div></div>
      <button class="redeem">兌換</button>
    </div>
    <div class="store">
      <div class="logo" style="background:#e4002b">全聯</div>
      <div style="flex:1"><div style="font-family:var(--disp);font-weight:700;font-size:15px">全聯福利中心</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">超值商品券</div></div>
      <button class="redeem">兌換</button>
    </div>
  </div>

  <!-- OTP sheet peeking -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line2);
    border-radius:26px 26px 0 0;padding:20px 22px 30px;box-shadow:0 -14px 34px rgba(17,20,28,.12)">
    <div style="width:40px;height:4px;border-radius:999px;background:#d3d7de;margin:0 auto 16px"></div>
    <div style="font-family:var(--disp);font-weight:800;font-size:17px">簡訊驗證出示券碼</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:5px">驗證碼已發送至 0918●●●225</div>
    <div style="display:flex;gap:9px;margin-top:16px">
      <div style="flex:1;height:52px;border-radius:13px;background:#fff7f2;border:1.5px solid #ff5a1f;
        display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:22px">3</div>
      <div style="flex:1;height:52px;border-radius:13px;background:#fff7f2;border:1.5px solid #ff5a1f;
        display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:22px">9</div>
      <div style="flex:1;height:52px;border-radius:13px;background:#fff7f2;border:1.5px solid #ff5a1f;
        display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:22px">1</div>
      <div style="flex:1;height:52px;border-radius:13px;background:#f5f6f8;border:1px solid var(--line2);
        display:flex;align-items:center;justify-content:center;color:var(--dim)">·</div>
      <div style="flex:1;height:52px;border-radius:13px;background:#f5f6f8;border:1px solid var(--line2);
        display:flex;align-items:center;justify-content:center;color:var(--dim)">·</div>
      <div style="flex:1;height:52px;border-radius:13px;background:#f5f6f8;border:1px solid var(--line2);
        display:flex;align-items:center;justify-content:center;color:var(--dim)">·</div>
    </div>
    <div style="margin-top:11px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between">
      <span>自動從簡訊帶入</span><span style="color:var(--pri)">重新發送 (48s)</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
