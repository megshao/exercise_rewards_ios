<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--card:#ffffff;--line:#ecedf1;--line2:#e0e3e9;
      --pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;--ok:#12a150;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 20px 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:#fff">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1d24" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-family:var(--disp);font-weight:800;font-size:20px">上傳運動紀錄</div>
  </div>

  <div style="padding:20px 20px 0">
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px">第 2 期 · 09/07 ~ 09/13 · 每期限上傳一次</div>

    <!-- generated card preview -->
    <div style="border-radius:22px;padding:2px;background:linear-gradient(140deg,#ffc24d,#ff5109);box-shadow:0 14px 32px rgba(255,90,31,.16)">
      <div style="background:#fff;border-radius:20px;padding:22px;color:#1a1d24">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:var(--disp);font-weight:800;font-size:16px;color:#e8480f">揮汗有禮 · 運動紀錄</div>
          <div style="font-size:12px;color:#8a94a3">2026/09/10</div>
        </div>
        <div style="display:flex;align-items:center;gap:18px;margin-top:16px">
          <div style="position:relative;width:104px;height:104px;flex:none">
            <svg width="104" height="104" viewBox="0 0 104 104">
              <circle cx="52" cy="52" r="44" fill="none" stroke="#eceef2" stroke-width="11"/>
              <circle cx="52" cy="52" r="44" fill="none" stroke="#ff5a1f" stroke-width="11" stroke-linecap="round"
                stroke-dasharray="276" stroke-dashoffset="40" transform="rotate(-90 52 52)"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-family:var(--disp);font-weight:800;font-size:24px;color:#1a1d24">8,540</div>
              <div style="font-size:10px;color:#8a94a3">步</div></div>
          </div>
          <div style="font-size:13px;line-height:1.9;color:#4a5364">
            距離　<b style="color:#1a1d24">5.8 km</b><br>
            運動　<b style="color:#1a1d24">36 分</b><br>
            步數目標　<b style="color:#12a150">已達標</b></div>
        </div>
        <div style="margin-top:14px;font-size:10.5px;color:#9aa1ac;border-top:1px dashed #e6e8ec;padding-top:10px">
          資料來源：Apple 健康 · 由裝置本機產生，數據未經修改</div>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ok)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#12a150" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      忠實呈現你的健康數據，符合活動審核佐證欄位</div>

    <!-- alt source -->
    <button style="width:100%;margin-top:18px;background:var(--card);border:1px solid var(--line2);
      border-radius:16px;padding:15px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:9px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#697485" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      改從相簿選擇截圖</button>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 20px 30px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(17,20,28,.05)">
    <button style="width:100%;border:none;cursor:pointer;border-radius:18px;padding:16px;
      background:linear-gradient(120deg,#ff7a2b,#ff5109);color:#fff;font-family:var(--disp);font-weight:800;
      font-size:16px;box-shadow:0 10px 22px rgba(255,90,31,.28)">確認並送出</button>
  </div>
</div>
</x-dc>
</body>
</html>
