<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:
      radial-gradient(88% 52% at 50% 14%, rgba(255,90,31,.14), transparent 62%),
      radial-gradient(70% 40% at 85% 2%, rgba(255,194,77,.20), transparent 60%), var(--bg)}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 28px 0;height:100%;display:flex;flex-direction:column">

    <!-- illustration -->
    <div style="margin-top:24px;align-self:center;width:250px;height:250px;border-radius:999px;
      background:radial-gradient(circle at 50% 40%,rgba(255,90,31,.16),rgba(255,90,31,.02) 70%);
      display:flex;align-items:center;justify-content:center;position:relative">
      <div style="position:absolute;inset:0;border-radius:999px;border:1.5px dashed rgba(255,90,31,.25)"></div>
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#ff5a1f" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 4a1.6 1.6 0 1 0 0-.01"/><path d="M6 20l3-5 3 2 1-4 3 3h2"/>
        <path d="M4 10l4-1 3 3 4-1"/></svg>
      <div style="position:absolute;top:14px;right:26px;width:40px;height:40px;border-radius:12px;
        background:#fff;border:1px solid rgba(255,90,31,.2);display:flex;align-items:center;justify-content:center;
        box-shadow:0 6px 16px rgba(255,90,31,.14)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff9a1f" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/>
          <path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7 8 3M12 7l4-4"/></svg></div>
    </div>

    <!-- copy -->
    <div style="margin-top:44px;text-align:center">
      <div style="font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.25">
        每天動一動<br><span style="color:var(--pri)">達標換好禮</span></div>
      <div style="margin-top:16px;font-size:15px;color:var(--muted);line-height:1.7;padding:0 6px">
        完成步數、健走或跑步任務，<br>每週就能領一張超商加碼券</div>
    </div>

    <div style="flex:1"></div>

    <!-- dots -->
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:22px">
      <div style="width:26px;height:8px;border-radius:999px;background:var(--pri)"></div>
      <div style="width:8px;height:8px;border-radius:999px;background:#d3d7de"></div>
      <div style="width:8px;height:8px;border-radius:999px;background:#d3d7de"></div>
    </div>

    <button style="width:100%;border:none;cursor:pointer;border-radius:18px;padding:17px;
      background:linear-gradient(120deg,#ff7a2b,#ff5109);color:#fff;font-family:var(--disp);font-weight:800;
      font-size:17px;box-shadow:0 12px 26px rgba(255,90,31,.32)">開始</button>
    <div style="text-align:center;margin:16px 0 30px;font-size:13px;color:var(--dim)">跳過</div>
  </div>
</div>
</x-dc>
</body>
</html>
