<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--card:#ffffff;--line:#ecedf1;--line2:#e0e3e9;
      --pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;--ok:#12a150;--danger:#e5443b;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
    .grp{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:0 5px 14px rgba(17,20,28,.04)}
    .item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:none}
    .ico{width:34px;height:34px;border-radius:10px;background:#fff2e8;display:flex;
      align-items:center;justify-content:center;flex:none}
    .t{flex:1;font-size:14.5px;font-weight:600}
    .sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 20px 8px">
    <div style="font-family:var(--disp);font-weight:800;font-size:24px">設定</div>
  </div>

  <div style="padding:14px 20px 0">

    <div style="font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1px;margin:6px 4px 10px">資安中心</div>
    <div class="grp">
      <div class="item">
        <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1f" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
        <div><div class="t">Face ID 解鎖</div><div class="sub">開啟 App 與敏感欄位時驗證</div></div>
        <div style="width:44px;height:26px;border-radius:999px;background:#ff5a1f;position:relative">
          <div style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div>
      </div>
      <div class="item">
        <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1f" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg></div>
        <div style="flex:1"><div class="t">本機資料</div><div class="sub">6 個欄位加密存放於 Keychain · 未同步 iCloud</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c3c8d0" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="item">
        <div class="ico" style="background:#fdeceb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e5443b" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></div>
        <div style="flex:1"><div class="t" style="color:var(--danger)">清除本機所有資料</div><div class="sub">立即刪除個資與登入狀態</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c3c8d0" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <div style="font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1px;margin:6px 4px 10px">連結與整合</div>
    <div class="grp">
      <div class="item">
        <div class="ico" style="background:#e6f6ee"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12a150" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l9 9 8.6-8.4a5.5 5.5 0 0 0 0-7.4Z"/></svg></div>
        <div style="flex:1"><div class="t">Apple 健康</div><div class="sub">唯讀步數 · 距離 · 運動時間</div></div>
        <div style="font-size:12px;color:var(--ok);font-weight:700">已連結</div>
      </div>
      <div class="item">
        <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1f" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.1-1.5 6.1-6.6A5.1 5.1 0 0 0 20 4.8 4.8 4.8 0 0 0 19.9 1S18.7.6 16 2.5a13.4 13.4 0 0 0-7 0C6.3.6 5.1 1 5.1 1A4.8 4.8 0 0 0 5 4.8a5.1 5.1 0 0 0-1.4 3.5c0 5.1 3.1 6.3 6.1 6.6a3.4 3.4 0 0 0-.9 2.6V22"/></svg></div>
        <div style="flex:1"><div class="t">開源專案</div><div class="sub">程式碼公開可稽核 · MIT 授權</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c3c8d0" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </div>
      <div class="item">
        <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1f" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6l-8-4Z"/></svg></div>
        <div style="flex:1"><div class="t">隱私說明</div><div class="sub">我們如何保護你的資料</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c3c8d0" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <div style="text-align:center;font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:6px">
揮汗有禮 v0.1 · 非官方工具<br>個資不上雲 · 不寫紀錄檔 · 只連 500.gov.tw</div>
  </div>
</div>
</x-dc>
</body>
</html>
