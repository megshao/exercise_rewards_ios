<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--bg:#f5f6f8;--card:#ffffff;--line:#ecedf1;--line2:#e0e3e9;
      --pri:#ff5a1f;--pri-d:#e8480f;--amber:#ffc24d;--text:#1a1d24;--muted:#697485;--dim:#9aa1ac;--ok:#12a150;--warn:#9a6400;
      --disp:"Baloo 2","Noto Sans TC",sans-serif;--body:"Noto Sans TC",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text)}
    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
    .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
    .card{border-radius:20px;padding:16px 18px;margin-bottom:12px}
    .no{font-family:var(--disp);font-weight:700;font-size:15px}
    .rng{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px}
  </style>
</helmet>

<div class="phone">
  <div style="padding:58px 20px 12px">
    <div style="font-family:var(--disp);font-weight:800;font-size:24px">我的任務</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:4px">每期七天，完成運動上傳並通過審核，即可換一張加碼券</div>
  </div>

  <div style="padding:4px 20px 0;height:690px;overflow:hidden">

    <!-- current week highlighted -->
    <div class="card" style="background:#fff;border:2px solid #ffc24d;
      box-shadow:0 14px 30px rgba(255,90,31,.12)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="no">第 1 期 <span class="rng">09/01 ~ 09/06</span></div>
        <div style="font-size:11px;color:var(--pri-d);font-weight:700">剩 1 天 22 小時</div>
      </div>
      <div style="margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:#fff;
        font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>任務完成，可兌換</div>
      <div style="margin-top:10px;font-size:12px;color:var(--muted)">上傳 09/03 21:42 · 審核 09/04 20:10 通過</div>
      <div style="margin-top:14px;display:flex;gap:10px">
        <button style="flex:1;border:none;cursor:pointer;border-radius:14px;padding:13px;
          background:linear-gradient(120deg,#ff7a2b,#ff5109);color:#fff;font-family:var(--disp);font-weight:800;font-size:14px">立即兌換</button>
        <button style="flex:none;padding:13px 16px;border-radius:14px;background:#fff;
          border:1px solid var(--line2);color:var(--text);font-weight:600;font-size:14px;cursor:pointer">看截圖</button>
      </div>
    </div>

    <!-- week 2 uploadable (sample) -->
    <div class="card" style="background:var(--card);border:1px solid var(--line2);box-shadow:0 6px 18px rgba(17,20,28,.05)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="no">第 2 期 <span class="rng">09/07 ~ 09/13</span></div>
        <div class="badge" style="background:#ffece1;color:var(--pri-d)">可上傳</div>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
        <button style="flex:1;border:none;cursor:pointer;border-radius:14px;padding:12px;background:#ff5a1f;
          color:#fff;font-family:var(--disp);font-weight:800;font-size:14px;display:flex;align-items:center;
          justify-content:center;gap:8px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>
          上傳運動紀錄</button>
      </div>
    </div>

    <!-- week 3 pending review -->
    <div class="card" style="background:var(--card);border:1px solid var(--line2);box-shadow:0 6px 18px rgba(17,20,28,.04)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="no">第 3 期 <span class="rng">09/14 ~ 09/20</span></div>
        <div class="badge" style="background:#fff4d6;color:var(--warn)">審核中</div>
      </div>
      <div style="margin-top:9px;font-size:12px;color:var(--dim)">已上傳 · 5 個工作日內完成審核</div>
    </div>

    <!-- future weeks not started -->
    <div class="card" style="background:#fafbfc;border:1px solid var(--line)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="no" style="color:var(--dim)">第 4 期 <span class="rng">09/21 ~ 09/27</span></div>
        <div class="badge" style="background:#eef0f3;color:var(--dim)">尚未開始</div>
      </div>
    </div>
    <div class="card" style="background:#fafbfc;border:1px solid var(--line)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="no" style="color:var(--dim)">第 5 期 <span class="rng">09/28 ~ 10/04</span></div>
        <div class="badge" style="background:#eef0f3;color:var(--dim)">尚未開始</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(transparent,var(--bg))"></div>
</div>
</x-dc>
</body>
</html>
